name: Build CGP release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Build Debian package
        run: python packaging/build_deb.py --output-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cgp-deb
          path: dist/*.deb
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Windows packager
        run: python -m pip install pyinstaller==6.22.3
      - name: Build Windows executable
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $version = python -c "from cgp import __version__; print(__version__)"
          pyinstaller --noconfirm --clean --onefile --windowed --paths src --name CGP src/cgp/__main__.py
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item dist/CGP.exe "dist/CGP-$version-windows-x64.exe"
          if (!(Test-Path "dist/CGP-$version-windows-x64.exe")) { throw "The Windows executable was not created." }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cgp-windows
          path: dist/*.exe
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-24.04
    needs:
      - build-deb
      - build-windows
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: cgp-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "CGP $GITHUB_REF_NAME" --generate-notes
